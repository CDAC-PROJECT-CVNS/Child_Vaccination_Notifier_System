spring.application.name=child-vaccination-backend
server.port=8080
server.servlet.context-path=/api
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vaccination_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
jwt.secret.key=${JWT_SECRET:ThisIsAProductionLengthSecretKeyForChildVaccinationNotifier2026ChangeIt}
jwt.exp.time=${JWT_EXPIRATION:86400000}
services.email.base-url=${EMAIL_SERVICE_URL:http://localhost:8081}
services.chatbot.base-url=${CHATBOT_SERVICE_URL:http://localhost:8000}
management.endpoints.web.exposure.include=health,info
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
services.nominatim.base-url=${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}

app.reminder.cron=${REMINDER_CRON:0 0 8 * * *}
app.reminder.zone=${REMINDER_ZONE:Asia/Kolkata}
